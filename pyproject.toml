[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-ocp"
version = "0.1.0"
description = "Multiple-shooting solver for nonlinear optimal control with continuous-time path constraints."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Lizhong Jiang" }]
keywords = [
    "casadi",
    "multiple-shooting",
    "nonlinear-programming",
    "optimal-control",
    "path-constraints",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "casadi>=3.6",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/LizhongJiang-adm/SMSOCP"
Issues = "https://github.com/LizhongJiang-adm/SMSOCP/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
examples = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
